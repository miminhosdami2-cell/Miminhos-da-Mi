<style>
:root{--rosa:#db2777;--fundo:#fff5f7}
body{font-family:sans-serif;max-width:450px;margin:auto;padding:15px;background:var(--fundo);color:#333}
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff5f7;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999}
#splash img{width:160px;border-radius:20px;margin-bottom:15px}
#splash h2{font-size:30px;color:var(--rosa);font-family:'Great Vibes',cursive}
h1{text-align:center;margin-bottom:10px}h1 .logo{max-width:150px;width:100%;border-radius:15px;display:block;margin:0 auto}
h1 .titulo{margin-top:8px;color:var(--rosa);font-size:36px;font-family:'Great Vibes',cursive}
.search{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:15px;box-sizing:border-box}
.tabs-container{position:relative;margin-bottom:15px;overflow:hidden}.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;background:#eee;border-radius:12px;cursor:pointer;white-space:nowrap;transition:.3s;font-size:14px;flex-shrink:0;font-weight:bold;border:1px solid transparent}.tab.active{background:var(--rosa);color:white;transform:scale(1.05)}
.card{background:white;border-radius:15px;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.05);position:relative}.card-wrap{position:relative}
.badge{position:absolute;left:10px;top:10px;background:red;color:white;padding:5px 8px;border-radius:8px;font-size:12px;font-weight:bold;z-index:2}.fav{position:absolute;right:10px;top:10px;font-size:22px;cursor:pointer;z-index:2}
.img-p{width:100%;height:250px;object-fit:cover;cursor:pointer;display:block}.info{padding:15px;text-align:center}.nome-clicavel{cursor:pointer;color:var(--rosa);text-decoration:underline;font-size:18px;margin:0 0 10px}.btn-add{background:var(--rosa);color:white;border:none;padding:12px;width:100%;border-radius:10px;cursor:pointer;font-weight:bold}
.carrinho{background:white;padding:20px;border-radius:15px;margin-top:30px;border:2px solid var(--rosa)}.item-cart{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:5px;font-size:14px}.cart-btns{display:flex;gap:5px;align-items:center}.cart-btns button{background:#f8f8f8;border:1px solid #ccc;width:28px;height:28px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px}
.btn-w{background:#25D366;color:white;padding:15px;border:none;width:100%;border-radius:10px;margin-top:8px;cursor:pointer;font-weight:bold;font-size:16px}
#install-banner{position:fixed;bottom:20px;left:10px;right:10px;background:var(--rosa);color:white;padding:15px;border-radius:12px;display:none;z-index:10001;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.2)}#install-banner button{background:white;color:var(--rosa);border:none;padding:8px 15px;border-radius:8px;font-weight:bold;margin-top:10px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:10000}.modal img{max-width:95%;max-height:85%;border-radius:10px}.modal-texto{background:white;padding:25px;border-radius:20px;max-width:85%;text-align:center}
.paginacao{display:flex;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}.btn-pag{padding:8px 14px;border:1px solid #ddd;background:white;border-radius:8px;cursor:pointer}.btn-pag.active{background:var(--rosa);color:white;border-color:var(--rosa)}
input,select{width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}

#btn-topo { position:fixed; right:15px; bottom:20px; width:44px; height:44px; border:none; border-radius:50%; background:var(--rosa); color:white; font-size:22px; font-weight:bold; cursor:pointer; z-index:9998; display:none; box-shadow:0 3px 10px rgba(0,0,0,.2); }
#btn-topo:hover { transform:scale(1.05); }
</style>

<script type="application/ld+json" id="dados-loja">
{"@context":"https://schema.org","@type":"Store","name":"Miminhos da Mi","url":"https://miminhos-da-mi.vercel.app/","logo":"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAESZQABachS_t8wMmKI4hL__gaNEWeA-jEAAvQlAAKmj0FWFSMMzvyYcaE6BA.png","image":"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAESZNBpyDNjcgFat1zgMyeFxqRGE_GUxgACpiUAAqaPQVa1bCMYXlu7BzoE.jpg","description":"Loja online de cristais, pedras naturais, pulseiras e presentes artesanais.","telephone":"+351938655760","address":{"@type":"PostalAddress","addressCountry":"PT"}}
</script>
</head>
<body>

<div id="splash"><img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAESZNBpyDNjcgFat1zgMyeFxqRGE_GUxgACpiUAAqaPQVa1bCMYXlu7BzoE.jpg" alt="Miminhos da Mi"><h2>Olá 👋</h2></div>
<div id="install-banner"><div>Gostavas de ter a Miminhos da Mi no teu ecrã inicial? ✨</div><button id="install-button">Instalar Agora</button></div>

<h1><img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAESZNBpyDNjcgFat1zgMyeFxqRGE_GUxgACpiUAAqaPQVa1bCMYXlu7BzoE.jpg" class="logo" alt="Miminhos da Mi - Cristais e presentes artesanais"><div class="titulo">Miminhos da Mi ✨</div></h1>
<input class="search" id="pesquisa" placeholder="🔍 Procurar em toda a loja..." aria-label="Procurar produtos" oninput="irParaPagina(1)">
<div class="tabs-container"><div class="tabs" id="tabs"></div></div>
<div id="loja"></div><div class="paginacao" id="paginacao"></div>

<div class="carrinho">
<h2>🛒 O Teu Pedido</h2><p>💳 MBWay: <strong>938655760</strong></p><div id="itens-carrinho"></div>
<p id="total-carrinho" style="font-size:18px;margin:15px 0;border-top:1px solid #eee;padding-top:10px"></p>
<input id="cliente" placeholder="Teu Nome Completo"><input id="telefone" placeholder="Teu Telemóvel"><input id="morada" placeholder="Morada completa de envio">
<label style="display:block;margin-top:15px"><strong>📦 Método de envio:</strong></label>
<select id="envio" onchange="atualizar()"><option>Levantamento (Grátis)</option><option>CTT Normal</option><option>CTT Registado</option></select>
<button onclick="finalizar()" class="btn-w">Finalizar via WhatsApp</button>
<button onclick="alert('Pagar para: 938655760\nEnvie o comprovativo pelo WhatsApp. 😊')" class="btn-w" style="background:#555">Pagar via MBWay</button>
<button onclick="copiar()" class="btn-w" style="background:#111">Copiar Resumo</button>
<button onclick="limparCarrinho()" class="btn-w" style="background:#dc2626;font-size:12px;padding:8px">Anular Pedido</button>
</div>

<button id="btn-topo" aria-label="Voltar ao topo" title="Voltar ao topo">⬆️</button>

<div class="modal" id="modalImg" onclick="fecharModal()"><img id="imgGrande" alt="Imagem ampliada do produto"></div>
<div class="modal" id="modalTexto" onclick="fecharModal()"><div class="modal-texto" onclick="event.stopPropagation()"><h3 id="tituloPedra" style="font-family:'Great Vibes';font-size:30px;color:var(--rosa)"></h3><p id="corpoSignificado" style="line-height:1.6"></p><button onclick="fecharModal()" style="background:var(--rosa);color:white;border:none;padding:10px 20px;border-radius:10px;margin-top:15px">Fechar</button></div></div>

<script>
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.log('SW error:',e)));

let deferredPrompt;const installBanner=document.getElementById('install-banner'),installButton=document.getElementById('install-button');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;let v=parseInt(localStorage.getItem('visitas_miminhos')||'0')+1;localStorage.setItem('visitas_miminhos',v);if(v>=3)installBanner.style.display='block'});
installButton.addEventListener('click',()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')installBanner.style.display='none';deferredPrompt=null})}});
window.onload=()=>setTimeout(()=>document.getElementById('splash').style.display='none',2000);

const API='https://script.google.com/macros/s/AKfycbw7iXZ525CvJqAHfBR23OsiarAxrjFU_vaHA75JA7G2hjy9Xany3bvKNdkpNQP7Jch3/exec';
let db=[],cart=JSON.parse(localStorage.getItem('cart'))||[],favs=JSON.parse(localStorage.getItem('favs'))||[];let categoriaAtual='',paginaAtual=1;const itensPorPagina=10;

function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function attrJson(v){return JSON.stringify(String(v??'')).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function atualizarSEO(){
let termo=document.getElementById('pesquisa').value.trim(),t='Miminhos da Mi | Cristais, Pulseiras e Presentes Artesanais ✨',d='Descubra a magia dos cristais na Miminhos da Mi. Pulseiras, pedras naturais, taças e acessórios artesanais com significados únicos.';
if(termo){t=termo+' | Miminhos da Mi';d='Encontra '+termo+' na Miminhos da Mi. Cristais, pedras naturais, pulseiras e presentes artesanais em Portugal.'}
else if(categoriaAtual==='🔥 Promoções'){t='Promoções | Miminhos da Mi';d='Vê as promoções da Miminhos da Mi em cristais, pedras naturais, pulseiras e presentes artesanais.'}
else if(categoriaAtual){t=categoriaAtual+' | Miminhos da Mi';d='Descobre '+categoriaAtual+' na Miminhos da Mi. Cristais, pedras naturais, pulseiras e presentes artesanais.'}
document.title=t;let m=document.querySelector('meta[name="description"]');if(m)m.content=d}

function atualizarSchema(lista){
document.querySelectorAll('script[data-produto-schema]').forEach(x=>x.remove());
lista.forEach(p=>{let preco=p.promo&&p.precoPromo?p.precoPromo:p.preco;if(!p.nome||!p.img||isNaN(preco))return;
let s=document.createElement('script');s.type='application/ld+json';s.dataset.produtoSchema='true';
s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Product","name":String(p.nome),"image":[String(p.img)],"description":String(p.significado||p.nome),"sku":String(p.id),"brand":{"@type":"Brand","name":"Miminhos da Mi"},"offers":{"@type":"Offer","url":"https://miminhos-da-mi.vercel.app/","priceCurrency":"EUR","price":Number(preco).toFixed(2),"availability":"https://schema.org/InStock"}});
document.head.appendChild(s)})}

function centrarAba(t){setTimeout(()=>{let c=document.getElementById('tabs'),a=[...document.querySelectorAll('.tab')].find(x=>x.innerText===t);if(a)c.scrollTo({left:a.offsetLeft-c.offsetWidth/2+a.offsetWidth/2,behavior:'smooth'})},100)}

fetch(API).then(r=>r.json()).then(data=>{
db=data.map(p=>({...p,id:parseInt(p.id),preco:parseFloat(p.preco),precoPromo:p.precoPromo?parseFloat(p.precoPromo):null,promo:p.promo==='sim',categoria:p.categoria||'Outros',significado:p.significado||''})).filter(p=>!isNaN(p.id));
db.sort(()=>Math.random()-.5);let cats=[...new Set(db.map(p=>p.categoria))];if(!categoriaAtual)categoriaAtual=cats[Math.floor(Math.random()*cats.length)];
renderTabs(cats);renderProdutos();atualizar();centrarAba(categoriaAtual)
}).catch(e=>console.error('Erro ao carregar produtos:',e));

function renderTabs(cats){let labels=db.some(p=>p.promo)?['🔥 Promoções',...cats]:cats;document.getElementById('tabs').innerHTML=labels.map((c,i)=>`<div class="tab ${c===categoriaAtual?'active':''}" data-cat-index="${i}">${esc(c)}</div>`).join('');document.querySelectorAll('#tabs .tab').forEach((el,i)=>el.addEventListener('click',()=>mudarCat(labels[i])))}

function mudarCat(c){categoriaAtual=c;paginaAtual=1;document.getElementById('pesquisa').value='';let cats=[...new Set(db.map(p=>p.categoria))];renderTabs(cats);renderProdutos();centrarAba(c);let clean=c.replace(/\s+/g,'-');window.history.pushState({},'', '#'+encodeURIComponent(clean));if(window.umami){umami.track('Ver Categoria',{categoria:c});umami.track(props=>({...props,url:window.location.pathname+'#'+clean}))}}

function irParaPagina(n){paginaAtual=n;renderProdutos();window.scrollTo(0,0)}

function renderProdutos(){
let termo=document.getElementById('pesquisa').value.trim().toLowerCase(),lista=db.filter(p=>termo?(p.nome.toLowerCase().includes(termo)||p.id.toString().includes(termo)):(categoriaAtual==='🔥 Promoções'?p.promo:p.categoria===categoriaAtual));
if(termo)lista.sort((a,b)=>(b.id.toString()===termo?1:0)-(a.id.toString()===termo?1:0));
atualizarSEO();atualizarSchema(lista);let itens=lista.slice((paginaAtual-1)*itensPorPagina,paginaAtual*itensPorPagina);
document.getElementById('loja').innerHTML=itens.map(p=>{let fav=favs.includes(p.nome)?'❤️':'🤍';let preco=p.promo&&p.precoPromo?`<p style="text-decoration:line-through;color:#999;font-size:13px;margin:0">${p.preco.toFixed(2)}€</p><p style="color:red;font-weight:bold;font-size:20px;margin:5px 0">${p.precoPromo.toFixed(2)}€ 🔥</p>`:`<p style="font-weight:bold;font-size:20px;margin:10px 0">${p.preco.toFixed(2)}€</p>`;
return `<div class="card"><div class="card-wrap">${p.promo?'<div class="badge">PROMO</div>':''}<span class="fav" onclick='toggleFav(${attrJson(p.nome)})'>${fav}</span><img src="${esc(p.img)}" class="img-p" alt="${esc(p.nome)} - Miminhos da Mi" loading="lazy" onclick='abrirImg(${attrJson(p.img)})'></div><div class="info"><h3 class="nome-clicavel" onclick='abrirSignificado(${attrJson(p.nome)},${attrJson(p.significado)})'>#${p.id} - ${esc(p.nome)} ℹ️</h3>${preco}<button class="btn-add" onclick="add(${p.id})">Adicionar ao Pedido</button></div></div>`}).join('');
let total=Math.ceil(lista.length/itensPorPagina),pag='';for(let i=1;i<=total;i++)pag+=`<button class="btn-pag ${i===paginaAtual?'active':''}" onclick="irParaPagina(${i})">${i}</button>`;document.getElementById('paginacao').innerHTML=total>1?pag:''}

function add(id){let p=db.find(x=>x.id===id);if(!p)return;let valor=p.promo&&p.precoPromo?p.precoPromo:p.preco,ex=cart.find(x=>x.id===id);if(ex)ex.qtd++;else cart.push({...p,precoFinal:valor,qtd:1});localStorage.setItem('cart',JSON.stringify(cart));atualizar()}
function atualizar(){let total=0;document.getElementById('itens-carrinho').innerHTML=cart.map((p,i)=>{total+=p.precoFinal*p.qtd;return `<div class="item-cart"><span>#${p.id} ${esc(p.nome)} (x${p.qtd})</span><div class="cart-btns"><button onclick="mudarQtd(${i},-1)">➖</button><button onclick="mudarQtd(${i},1)">➕</button></div></div>`}).join('')||"<p style='color:#888'>O teu carrinho está vazio...</p>";document.getElementById('total-carrinho').innerHTML=`<strong>Total: ${total.toFixed(2)}€</strong><br><small>Método: ${esc(document.getElementById('envio').value)}</small>`}
function mudarQtd(i,n){if(!cart[i])return;cart[i].qtd+=n;if(cart[i].qtd<1)cart.splice(i,1);localStorage.setItem('cart',JSON.stringify(cart));atualizar()}
function limparCarrinho(){if(confirm('Anular pedido?')){cart=[];localStorage.removeItem('cart');atualizar()}}
function abrirImg(src){document.getElementById('modalImg').style.display='flex';document.getElementById('imgGrande').src=src}
function abrirSignificado(nome,text){document.getElementById('tituloPedra').innerText=nome;document.getElementById('corpoSignificado').innerText=text||'Significado disponível em breve! ✨';document.getElementById('modalTexto').style.display='flex'}
function fecharModal(){document.getElementById('modalImg').style.display='none';document.getElementById('modalTexto').style.display='none'}
function toggleFav(n){if(favs.includes(n))favs=favs.filter(f=>f!==n);else favs.push(n);localStorage.setItem('favs',JSON.stringify(favs));renderProdutos()}
function copiar(){let total=cart.reduce((a,p)=>a+p.precoFinal*p.qtd,0);navigator.clipboard.writeText(`Pedido Miminhos da Mi - Total: ${total.toFixed(2)}€`);alert('Resumo copiado!')}
function finalizar(){if(!cart.length)return alert('Carrinho vazio!');let nome=document.getElementById('cliente').value,tel=document.getElementById('telefone').value,morada=document.getElementById('morada').value,envio=document.getElementById('envio').value;if(!nome||!tel)return alert('Por favor indica Nome e Telemóvel.');let total=cart.reduce((a,p)=>a+p.precoFinal*p.qtd,0),msg=`*PEDIDO MIMINHOS DA MI*\n\n*Cliente:* ${nome}\n*Tel:* ${tel}\n*Morada:* ${morada}\n*Envio:* ${envio}\n\n*ITENS:*\n`+cart.map(p=>`- #${p.id} ${p.nome} (x${p.qtd})`).join('\n')+`\n\n*TOTAL:* ${total.toFixed(2)}€\n*Pagamento:* MBWay 938655760`;window.open(`https://wa.me/351938655760?text=${encodeURIComponent(msg)}`)}

const btnTopo = document.getElementById("btn-topo");
window.addEventListener("scroll", () => {
  if (btnTopo) btnTopo.style.display = window.scrollY > 350 ? "block" : "none";
});
if (btnTopo) btnTopo.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
</html>
