<script>
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.log('SW error:',e)));

let deferredPrompt;const installBanner=document.getElementById('install-banner'),installButton=document.getElementById('install-button');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;let v=parseInt(localStorage.getItem('visitas_miminhos')||'0')+1;localStorage.setItem('visitas_miminhos',v);if(v>=3)installBanner.style.display='block'});
installButton.addEventListener('click',()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')installBanner.style.display='none';deferredPrompt=null})}});

const API='https://script.google.com/macros/s/AKfycbzZM9n88oC5ND03sB1nPPxpzoHnZjK6W2S5YJk-w3AHkSDf_pNXK5nB7xEBgdtxIfWh/exec';
// A API deverá responder a ?tipo=videos com a folha "Videos" do Google Sheets.
let db=[],cart=JSON.parse(localStorage.getItem('cart'))||[],favs=JSON.parse(localStorage.getItem('favs'))||[];
let categoriaAtual='',paginaAtual=1;const itensPorPagina=10;
const BASE_URL='https://miminhos-da-mi.vercel.app/';

/* =========================================================
   VÍDEOS
   Basta adicionar vídeos aqui no futuro.
   Exemplo:
   {titulo:'Turmalina Negra',url:'https://www.youtube.com/watch?v=XXXXXXXXXXX'}
   A miniatura é criada automaticamente a partir do YouTube.
   ========================================================= */
let VIDEOS=[];
let videosCarregados=false;
let videosACarregar=null;
let videosAberto=false;

/* Os vídeos vêm da folha "Videos" do mesmo Google Sheets.
   Colunas esperadas: Ativo | Título | Link YouTube | Descrição
   Apenas linhas com Ativo = SIM são mostradas.
*/
function normalizarVideos(data){
  if(!Array.isArray(data))return [];
  return data.map(v=>{
    let ativo=String(v.Ativo??v.ativo??v.ATIVO??'').trim().toUpperCase();
    let titulo=String(v.Título??v.Titulo??v.titulo??v.nome??'').trim();
    let url=String(v['Link YouTube']??v.Link??v.link??v.url??v.URL??'').trim();
    let descricao=String(v.Descrição??v.Descricao??v.descricao??'').trim();
    return {ativo,titulo,url,descricao};
  }).filter(v=>v.ativo==='SIM'&&v.titulo&&getYouTubeId(v.url));
}

function extrairListaVideos(data){
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.videos))return data.videos;
  if(data&&Array.isArray(data.Videos))return data.Videos;
  if(data&&Array.isArray(data.data))return data.data;
  return [];
}

function carregarVideos(){
  if(videosCarregados)return Promise.resolve(VIDEOS);
  if(videosACarregar)return videosACarregar;

  videosACarregar=fetch(API+'?tipo=videos',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('Resposta dos vídeos: '+r.status);return r.json()})
    .then(data=>{
      VIDEOS=normalizarVideos(extrairListaVideos(data));
      videosCarregados=true;
      return VIDEOS;
    })
    .catch(e=>{
      console.warn('Vídeos indisponíveis:',e);
      VIDEOS=[];
      videosCarregados=true;
      return [];
    });

  return videosACarregar;
}

function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function attrJson(v){return JSON.stringify(String(v??'')).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function getYouTubeId(url){
try{
let u=new URL(url);
if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];
if(u.hostname.includes('youtube.com')){
if(u.searchParams.get('v'))return u.searchParams.get('v');
let partes=u.pathname.split('/').filter(Boolean);
let i=partes.findIndex(x=>x==='shorts'||x==='embed'||x==='live');
if(i>=0&&partes[i+1])return partes[i+1];
}
}catch(e){}
return '';
}
function getYouTubeThumb(url){
let id=getYouTubeId(url);
return id?'https://img.youtube.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg':'';
}
function getYouTubeEmbed(url){
let id=getYouTubeId(url);
if(!id)return '';
/*
  V5 FINAL:
  O YouTube passou a devolver o erro 153 quando o pedido do player
  não inclui HTTP Referer ou identificação equivalente.
  A loja publicada usa esta origem oficial para o player.
*/
let origin=encodeURIComponent('https://miminhos-da-mi.vercel.app');
let widgetReferrer=encodeURIComponent('https://miminhos-da-mi.vercel.app/');
return 'https://www.youtube.com/embed/'+encodeURIComponent(id)+
  '?autoplay=1&rel=0&playsinline=1&origin='+origin+
  '&widget_referrer='+widgetReferrer;
}
function abrirVideo(url){
let embed=getYouTubeEmbed(url);
if(!embed){alert('O link deste vídeo do YouTube não é válido.');return}
document.getElementById('videoFrame').src=embed;
document.getElementById('modalVideo').style.display='flex';
}
function fecharVideo(){
document.getElementById('modalVideo').style.display='none';
document.getElementById('videoFrame').src='';
}
function renderVideos(){
videosAberto=true;
document.getElementById('paginacao').innerHTML='';
document.getElementById('loja').innerHTML=VIDEOS.length?
`<div class="videos-intro"><h2 style="color:var(--rosa);margin:0 0 6px">🎥 Vídeos</h2><p style="margin:0;color:#666">Descobre os nossos cristais, produtos e novidades em vídeo. ✨</p></div>
<div class="video-grid">${VIDEOS.map(v=>{
let thumb=getYouTubeThumb(v.url);
return `<div class="video-card"><div class="video-thumb" onclick='abrirVideo(${attrJson(v.url)})'>${thumb?`<img src="${esc(thumb)}" alt="${esc(v.titulo)}" loading="lazy" decoding="async">`:'<div style="height:230px;display:flex;align-items:center;justify-content:center;color:#888">Vídeo</div>'}<div class="video-play">▶</div></div><div class="video-info"><h3>${esc(v.titulo)}</h3>${v.descricao?`<p>${esc(v.descricao)}</p>`:''}</div></div>`
}).join('')}</div>`
:`<div class="video-vazio"><div style="font-size:45px">🎥</div><h2 style="color:var(--rosa)">Ainda não existem vídeos</h2><p>Em breve teremos novidades em vídeo. ✨</p></div>`;
}
async function abrirAbaVideos(){
  videosAberto=true;
  categoriaAtual='🎥 Vídeos';
  document.getElementById('pesquisa').value='';
  document.getElementById('loja').innerHTML='<div class="video-vazio"><div style="font-size:40px">🎥</div><p>A carregar vídeos... ✨</p></div>';
  history.pushState({videos:true},'',BASE_URL+'?videos=1');
  atualizarSEO();

  await carregarVideos();

  /* Se não houver vídeos ativos, não deixamos a aba visível. */
  if(!VIDEOS.length){
    videosAberto=false;
    let cats=[...new Set(db.map(p=>p.categoria))];
    categoriaAtual=cats[0]||'';
    renderTabs(cats);
    renderProdutos();
    atualizarURL(categoriaAtual,true);
    return;
  }

  renderTabs([...new Set(db.map(p=>p.categoria))]);
  renderVideos();
  centrarAba('🎥 Vídeos');
}
function voltarProdutos(){
videosAberto=false;
let c=categoriaPeloURL()||([...new Set(db.map(p=>p.categoria))][0]||'');
categoriaAtual=c;paginaAtual=1;
renderTabs([...new Set(db.map(p=>p.categoria))]);
renderProdutos();
centrarAba(c);
}

/* Estado e interface */
function esconderSplash(){let splash=document.getElementById('splash');if(splash)splash.style.display='none'}

function atualizarSEO(){
let termo=document.getElementById('pesquisa').value.trim(),t='Miminhos da Mi | Cristais, Pulseiras e Presentes Artesanais ✨',d='Descubra a magia dos cristais na Miminhos da Mi. Pulseiras, pedras naturais, taças e acessórios artesanais com significados únicos.';
if(videosAberto){t='Vídeos | Miminhos da Mi';d='Vídeos da Miminhos da Mi sobre cristais, pedras naturais, produtos e novidades.'}
else if(termo){t=termo+' | Miminhos da Mi';d='Encontra '+termo+' na Miminhos da Mi. Cristais, pedras naturais, pulseiras e presentes artesanais em Portugal.'}
else if(categoriaAtual==='🔥 Promoções'){t='Promoções | Miminhos da Mi';d='Vê as promoções da Miminhos da Mi em cristais, pedras naturais, pulseiras e presentes artesanais.'}
else if(categoriaAtual){t=categoriaAtual+' | Miminhos da Mi';d='Descobre '+categoriaAtual+' na Miminhos da Mi. Cristais, pedras naturais, pulseiras e presentes artesanais.'}
document.title=t;let m=document.querySelector('meta[name="description"]');if(m)m.content=d;
}
function slugify(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/🔥/g,'promocoes').replace(/&/g,' e ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function urlCategoria(c){return BASE_URL+'?categoria='+encodeURIComponent(slugify(c))}
function atualizarURL(c,replace=false){let url=urlCategoria(c);if(window.location.href!==url)history[replace?'replaceState':'pushState']({categoria:c},'',url)}
function categoriaPeloURL(){let slug=new URLSearchParams(window.location.search).get('categoria');if(!slug)return '';slug=decodeURIComponent(slug);if(slug==='promocoes')return '🔥 Promoções';let encontrado=db.find(p=>slugify(p.categoria)===slug);if(encontrado)return encontrado.categoria;return ''}
function atualizarSchema(lista){document.querySelectorAll('script[data-produto-schema]').forEach(x=>x.remove());lista.slice(0,10).forEach(p=>{let preco=p.promo&&p.precoPromo?p.precoPromo:p.preco;if(!p.nome||!p.img||isNaN(preco))return;let s=document.createElement('script');s.type='application/ld+json';s.dataset.produtoSchema='true';s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Product","name":String(p.nome),"image":[String(p.img)],"description":String(p.significado||p.nome),"sku":String(p.id),"brand":{"@type":"Brand","name":"Miminhos da Mi"},"offers":{"@type":"Offer","url":urlCategoria(p.categoria),"priceCurrency":"EUR","price":Number(preco).toFixed(2),"availability":"https://schema.org/InStock"}});document.head.appendChild(s)})}
function centrarAba(t){setTimeout(()=>{let c=document.getElementById('tabs'),a=[...document.querySelectorAll('.tab')].find(x=>x.innerText===t);if(a)c.scrollTo({left:a.offsetLeft-c.offsetWidth/2+a.offsetWidth/2,behavior:'smooth'})},100)}
function carregarEstadoURL(){
let params=new URLSearchParams(window.location.search);
if(params.get('videos')==='1'){videosAberto=true;categoriaAtual='🎥 Vídeos';return}
let c=categoriaPeloURL();if(c)categoriaAtual=c;else if(!categoriaAtual&&db.length){let cats=[...new Set(db.map(p=>p.categoria))];categoriaAtual=cats[Math.floor(Math.random()*cats.length)]}
}

/* CARREGAMENTO ROBUSTO DOS PRODUTOS */
const CACHE_PRODUTOS='miminhos_produtos_cache_v2';
setTimeout(esconderSplash,2000);
window.addEventListener('load',()=>setTimeout(esconderSplash,1000));
function normalizarProdutos(data){return data.map(p=>({...p,id:parseInt(p.id),preco:parseFloat(p.preco),precoPromo:p.precoPromo?parseFloat(p.precoPromo):null,promo:p.promo==='sim',categoria:p.categoria||'Outros',significado:p.significado||''})).filter(p=>!isNaN(p.id))}
function mostrarProdutosNaLoja(){
if(!db.length)return;
carregarEstadoURL();
let cats=[...new Set(db.map(p=>p.categoria))];
renderTabs(cats);
if(videosAberto)renderVideos();else renderProdutos();
atualizar();centrarAba(videosAberto?'🎥 Vídeos':categoriaAtual);
if(categoriaAtual&&!videosAberto)atualizarURL(categoriaAtual,true);
}
function carregarCache(){try{let guardado=localStorage.getItem(CACHE_PRODUTOS);if(!guardado)return false;let dados=JSON.parse(guardado);if(!Array.isArray(dados)||!dados.length)return false;db=dados;mostrarProdutosNaLoja();return true}catch(e){console.warn('Cache de produtos indisponível:',e);return false}}
function guardarCache(){try{localStorage.setItem(CACHE_PRODUTOS,JSON.stringify(db))}catch(e){console.warn('Não foi possível guardar o cache:',e)}}
function mostrarCarregamento(){let loja=document.getElementById('loja');if(loja&&!db.length)loja.innerHTML='<p style="text-align:center;color:#777;padding:25px">A carregar os produtos... ✨</p>'}
function carregarProdutos(tentativa=1){
if(!db.length)mostrarCarregamento();
fetch(API,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Resposta da API: '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw new Error('A API não devolveu uma lista de produtos.');let novos=normalizarProdutos(data);if(!novos.length)throw new Error('A API devolveu zero produtos.');db=novos;db.sort(()=>Math.random()-.5);guardarCache();mostrarProdutosNaLoja()}).catch(e=>{
console.error('Erro ao atualizar produtos (tentativa '+tentativa+'):',e);
if(db.length){esconderSplash();if(tentativa<3)setTimeout(()=>carregarProdutos(tentativa+1),tentativa*3000);return}
if(tentativa<3)setTimeout(()=>carregarProdutos(tentativa+1),tentativa*3000);else{let loja=document.getElementById('loja');if(loja)loja.innerHTML='<div style="text-align:center;color:#777;padding:25px"><p>Não foi possível carregar os produtos neste momento. ✨</p><button onclick="carregarProdutos(1)" style="background:var(--rosa);color:white;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer">Tentar novamente</button></div>';esconderSplash()}
});
}
const tinhaCache=carregarCache();if(!tinhaCache)mostrarCarregamento();carregarProdutos();

/* Consulta os vídeos em segundo plano. Não bloqueia nem atrasa os produtos. */
prepararAbaVideos();

function renderTabs(cats){
  let labels=[];
  /* Só mostramos Vídeos depois de confirmarmos que existe pelo menos um vídeo ativo. */
  if(videosCarregados&&VIDEOS.length)labels.push('🎥 Vídeos');
  if(db.some(p=>p.promo))labels.push('🔥 Promoções');
  labels.push(...cats);

  document.getElementById('tabs').innerHTML=labels.map((c,i)=>`<div class="tab ${c===categoriaAtual?'active':''}" data-cat-index="${i}">${esc(c)}</div>`).join('');
  document.querySelectorAll('#tabs .tab').forEach((el,i)=>el.addEventListener('click',()=>labels[i]==='🎥 Vídeos'?abrirAbaVideos():mudarCat(labels[i])));
}

async function prepararAbaVideos(){
  await carregarVideos();
  if(videosCarregados&&VIDEOS.length){
    renderTabs([...new Set(db.map(p=>p.categoria))]);
    if(videosAberto)renderVideos();
  }
}
function mudarCat(c){
categoriaAtual=c;videosAberto=false;paginaAtual=1;document.getElementById('pesquisa').value='';
let cats=[...new Set(db.map(p=>p.categoria))];renderTabs(cats);renderProdutos();centrarAba(c);atualizarURL(c);
if(window.umami){umami.track('Ver Categoria',{categoria:c});umami.track(props=>({...props,url:window.location.pathname}))}
}
window.addEventListener('popstate',()=>{
let params=new URLSearchParams(window.location.search);
if(params.get('videos')==='1'){
  abrirAbaVideos();
  return;
}
let c=categoriaPeloURL();if(c){videosAberto=false;categoriaAtual=c;paginaAtual=1;document.getElementById('pesquisa').value='';renderTabs([...new Set(db.map(p=>p.categoria))]);renderProdutos();centrarAba(c)}
});
function irParaPagina(n){if(videosAberto)return;paginaAtual=n;renderProdutos();window.scrollTo(0,0)}
function renderProdutos(){
let termo=document.getElementById('pesquisa').value.trim().toLowerCase(),lista=db.filter(p=>termo?(p.nome.toLowerCase().includes(termo)||p.id.toString().includes(termo)):(categoriaAtual==='🔥 Promoções'?p.promo:p.categoria===categoriaAtual));
if(termo)lista.sort((a,b)=>(b.id.toString()===termo?1:0)-(a.id.toString()===termo?1:0));
atualizarSEO();let itens=lista.slice((paginaAtual-1)*itensPorPagina,paginaAtual*itensPorPagina);atualizarSchema(itens);
document.getElementById('loja').innerHTML=itens.map(p=>{
let fav=favs.includes(p.nome)?'❤️':'🤍';
let preco=p.promo&&p.precoPromo?`<p style="text-decoration:line-through;color:#999;font-size:13px;margin:0">${p.preco.toFixed(2)}€</p><p style="color:red;font-weight:bold;font-size:20px;margin:5px 0">${p.precoPromo.toFixed(2)}€ 🔥</p>`:`<p style="font-weight:bold;font-size:20px;margin:10px 0">${p.preco.toFixed(2)}€</p>`;
return `<div class="card"><div class="card-wrap">${p.promo?'<div class="badge">PROMO</div>':''}<span class="fav" onclick='toggleFav(${attrJson(p.nome)})'>${fav}</span><img src="${esc(p.img)}" class="img-p" alt="${esc(p.nome)} - Miminhos da Mi" loading="lazy" decoding="async" onclick='abrirImg(${attrJson(p.img)})'></div><div class="info"><h3 class="nome-clicavel" onclick='abrirSignificado(${attrJson(p.nome)},${attrJson(p.significado)})'>#${p.id} - ${esc(p.nome)} <kbd>INFO</kbd> ℹ️</h3>${preco}<button class="btn-add" onclick="add(${p.id}, this)">Adicionar ao Pedido</button></div></div>`}).join('');
let total=Math.ceil(lista.length/itensPorPagina),pag='';for(let i=1;i<=total;i++)pag+=`<button class="btn-pag ${i===paginaAtual?'active':''}" onclick="irParaPagina(${i})">${i}</button>`;
document.getElementById('paginacao').innerHTML=total>1?pag:'';
}
function add(id,btn){let p=db.find(x=>x.id===id);if(!p)return;let valor=p.promo&&p.precoPromo?p.precoPromo:p.preco,ex=cart.find(x=>x.id===id);if(ex)ex.qtd++;else cart.push({...p,precoFinal:valor,qtd:1});localStorage.setItem('cart',JSON.stringify(cart));atualizar();if(btn){let textoOriginal=btn.innerText;btn.innerText='Adicionado! ✨';btn.style.backgroundColor='#16a34a';setTimeout(()=>{btn.innerText=textoOriginal;btn.style.backgroundColor=''},1500)}}
function atualizar(){let total=0;document.getElementById('itens-carrinho').innerHTML=cart.map((p,i)=>{total+=p.precoFinal*p.qtd;return `<div class="item-cart"><span>#${p.id} ${esc(p.nome)} (x${p.qtd})</span><div class="cart-btns"><button onclick="mudarQtd(${i},-1)">➖</button><button onclick="mudarQtd(${i},1)">➕</button></div></div>`}).join('')||"<p style='color:#888'>O teu carrinho está vazio...</p>";document.getElementById('total-carrinho').innerHTML=`<strong>Total: ${total.toFixed(2)}€</strong><br><small>Método: ${esc(document.getElementById('envio').value)}</small>`}
function mudarQtd(i,n){if(!cart[i])return;cart[i].qtd+=n;if(cart[i].qtd<1)cart.splice(i,1);localStorage.setItem('cart',JSON.stringify(cart));atualizar()}
function limparCarrinho(){if(confirm('Anular pedido?')){cart=[];localStorage.removeItem('cart');atualizar()}}
function abrirImg(src){document.getElementById('modalImg').style.display='flex';document.getElementById('imgGrande').src=src}
function abrirSignificado(nome,text){document.getElementById('tituloPedra').innerText=nome;document.getElementById('corpoSignificado').innerText=text||'Significado disponível em breve! ✨';document.getElementById('modalTexto').style.display='flex'}
function fecharModal(){document.getElementById('modalImg').style.display='none';document.getElementById('modalTexto').style.display='none'}
function toggleFav(n){if(favs.includes(n))favs=favs.filter(f=>f!==n);else favs.push(n);localStorage.setItem('favs',JSON.stringify(favs));renderProdutos()}
function copiar(){let total=cart.reduce((a,p)=>a+p.precoFinal*p.qtd,0);navigator.clipboard.writeText(`Pedido Miminhos da Mi - Total: ${total.toFixed(2)}€`);alert('Resumo copiado!')}
function finalizar(){if(!cart.length)return alert('Carrinho vazio!');let nome=document.getElementById('cliente').value,tel=document.getElementById('telefone').value,morada=document.getElementById('morada').value,envio=document.getElementById('envio').value;if(!nome||!tel)return alert('Por favor indica Nome e Telemóvel.');let total=cart.reduce((a,p)=>a+p.precoFinal*p.qtd,0),msg=`*PEDIDO MIMINHOS DA MI*\n\n*Cliente:* ${nome}\n*Tel:* ${tel}\n*Morada:* ${morada}\n*Envio:* ${envio}\n\n*ITENS:*\n`+cart.map(p=>`- #${p.id} ${p.nome} (x${p.qtd})`).join('\n')+`\n\n*TOTAL:* ${total.toFixed(2)}€\n*Pagamento:* MBWay 938655760`;window.open(`https://wa.me/351938655760?text=${encodeURIComponent(msg)}`)}
const btnTopo=document.getElementById("btn-topo");
window.addEventListener("scroll",()=>{if(btnTopo)btnTopo.style.display=window.scrollY>350?"block":"none"});
if(btnTopo)btnTopo.addEventListener("click",()=>{window.scrollTo({top:0,behavior:"smooth"})});
</script>
</body>
</html>
